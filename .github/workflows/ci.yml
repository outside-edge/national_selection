name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: make check
      - run: make prepare evaluate forecast
