name: Monthly forecast refresh

on:
  schedule:
    - cron: '23 8 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-forecast-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publication.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: '1.10.20'
      - run: python -m pip install -e '.[dev]'
      - run: make check
      - name: Refresh data and issue dated forecasts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make refresh
      - run: make site
      - name: Save verified forecasts and history
        id: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current out/current out/history
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh monthly international-entry forecasts'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.refresh.outputs.commit }}
