[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "national-selection"
version = "0.1.0"
description = "Chronological forecasts of first national cricket appearances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.8,<1.9", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
national-selection = "national_selection.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff]
line-length = 88

[tool.setuptools.package-data]
national_selection = ["reference/*.csv"]
